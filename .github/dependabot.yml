version: 2
updates:
  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Test dependencies. There is no runtime requirement: the integration
  # declares an empty `requirements` in its manifest.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pytest-ecosystem:
        patterns:
          - "pytest*"
