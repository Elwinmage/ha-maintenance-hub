[pytest]
asyncio_mode = auto
testpaths = tests
norecursedirs = .git

# Puts the repo root on sys.path so `custom_components.reef_maintenance` is
# importable from the tests. Doing it here rather than with a sys.path insert
# in conftest.py keeps every test import at the top of its file: an import
# after executable code is an E402, which the CI ruff enforces.
pythonpath = .
